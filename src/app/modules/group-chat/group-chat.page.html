<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Mensajes del chat -->
  <ion-list>
    <ion-item *ngFor="let message of messages | async">
      <ion-label>
        <h2>{{ message.senderId }}</h2>
        <p>{{ message.message }}</p>
        <small>{{ message.timestamp.toDate() | date:'short' }}</small>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Campo para escribir mensaje -->
  <ion-item>
    <ion-input [(ngModel)]="newMessage" placeholder="Escribe tu mensaje..."></ion-input>
  </ion-item>

  <!-- Botón para enviar mensaje -->
  <ion-footer>
    <ion-button expand="full" (click)="sendMessage()">Enviar</ion-button>
  </ion-footer>
</ion-content>
